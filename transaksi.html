            <input type="number" id="nominal-transaksi" placeholder="Nominal transaksi">
            <select id="kategori-transaksi"></select>
            <input type="date" id="tanggal-transaksi">
            <button id="btn-simpan-transaksi">Simpan</button>
        </section>
        <section class="riwayat-section">
            <h2 class="riwayat-title">Riwayat Transaksi</h2>
            <ul id="list-transaksi"></ul>
