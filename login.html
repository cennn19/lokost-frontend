<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lokost</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="css/navigasi.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" type="image/png" href="asset/icon-192.png" />
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-logo">
            <div class="logo-box"><img src="asset/icon-192.png" alt="" height="42px" width="42px"></div>
            <span class="auth-brand">Lokost</span>
        </div>
        <h1 class="auth-title">Selamat datang</h1>
        <p class="auth-subtitle">Login ke akun Lokost kamu</p>

        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn-auth">Login</button>
            <p class="auth-switch">Belum punya akun? <a href="register.html">Register</a></p>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
